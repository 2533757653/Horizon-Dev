<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><title>Horizon</title><script src=https://cdn.jsdelivr.net/npm/chart.js></script></head><body style=margin:0;font-family:system-ui;background:#0f1419;color:#e7e9ea><header style=background:#1a1f26;padding:12px24px;display:flex;justify-content:space-between><h1 style=color:#fff>Horizon Trading Platform</h1><div><span id=dot style=display:inline-block;width:8px;height:8px;background:#f4212e;border-radius:50%></span> <span style=color:#71767b>Disconnected</span> <span style=background:#00ba7c;color:#fff;padding:4px10px;border-radius:4px>LIVE</span></div></header><main style=padding:16px><canvas id=chart style=height:250px></canvas><div style=display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px><div style=background:#1a1f26;border:1px solid #2f3336;border-radius:8px;padding:16px><h3 style=color:#71767b;margin-bottom:8px>Market Data</h3><div id=tickers><div style=padding:8px;background:#0f1419;border-radius:4px;margin-bottom:8px><div style=color:#71767b>BTC</div><div id=price-BTCUSDT style=font-size:20px;color:#fff>--</div><div id=vol-BTCUSDT style=color:#71767b;font-size:12px>--</div></div><div style=padding:8px;background:#0f1419;border-radius:4px;margin-bottom:8px><div style=color:#71767b>ETH</div><div id=price-ETHUSDT style=font-size:20px;color:#fff>--</div><div id=vol-ETHUSDT style=color:#71767b;font-size:12px>--</div></div><div style=padding:8px;background:#0f1419;border-radius:4px;margin-bottom:8px><div style=color:#71767b>SOL</div><div id=price-SOLUSDT style=font-size:20px;color:#fff>--</div><div id=vol-SOLUSDT style=color:#71767b;font-size:12px>--</div></div></div></div><div style=background:#1a1f26;border:1px solid #2f3336;border-radius:8px;padding:16px><h3 style=color:#71767b;margin-bottom:8px>Portfolio</h3><div id=portfolioContent><div style=color:#71767b;text-align:center;padding:20px>Loading...</div></div></div><div style=background:#1a1f26;border:1px solid #2f3336;border-radius:8px;padding:16px><h3 style=color:#71767b;margin-bottom:8px>Positions</h3><div id=positionContent><div style=color:#71767b;text-align:center;padding:20px>Loading...</div></div></div><div style=background:#1a1f26;border:1px solid #2f3336;border-radius:8px;padding:16px><h3 style=color:#71767b;margin-bottom:8px>Place Order</h3><form id=form style=display:grid;grid-template-columns:1fr 1fr;gap:8px><select name=exchange style=background:#0f1419;border:1px solid #2f3336;color:#e7e9ea;padding:8px;border-radius:4px><option>Binance</option><option>HTX</option><option>Hyperliquid</option></select><select name=symbol style=background:#0f1419;border:1px solid #2f3336;color:#e7e9ea;padding:8px;border-radius:4px><option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option><option>BNBUSDT</option></select><select name=type id=type style=background:#0f1419;border:1px solid #2f3336;color:#e7e9ea;padding:8px;border-radius:4px><option>market>Market</option><option>limit>Limit</option></select><input type=number name=volume step=0.0001 placeholder=Volume required style=background:#0f1419;border:1px solid #2f3336;color:#e7e9ea;padding:8px;border-radius:4px><input type=number name=price id=price placeholder=Price style=background:#0f1419;border:1px solid #2f3336;color:#e7e9ea;padding:8px;border-radius:4px;display:none><div style=display:grid;grid-column:1/-1;grid-template-columns:1fr 1fr;gap:8px><button type=submit name=side value=buy style=background:#00ba7c;color:#fff;border:none;padding:10px;border-radius:4px;cursor:pointer;font-weight:600>BUY</button><button type=submit name=side value=sell style=background:#f4212e;color:#fff;border:none;padding:10px;border-radius:4px;cursor:pointer;font-weight:600>SELL</button></div></form></div><div style=grid-column:1/-1;background:#1a1f26;border:1px solid #2f3336;border-radius:8px;padding:16px><h3 style=color:#71767b;margin-bottom:8px>Open Orders</h3><div id=ordersContent><div style=color:#71767b;text-align:center;padding:20px>Loading...</div></div></div></div></main><script>const API="";let c;let d={l:[],p:[]};function init(){c=new Chart(document.getElementById("chart").getContext("2d"),{type:"line",data:{labels:d.l,datasets:[{data:d.p,borderColor:"#00ba7c",fill:true,tension:0.4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});document.getElementById("type").onchange=function(){document.getElementById("price").style.display=this.value=="limit"?"block":"none"};document.getElementById("form").onsubmit=async function(e){e.preventDefault();const fd=new FormData(this);const b={exchange:fd.get("exchange"),symbol:fd.get("symbol"),type:fd.get("type"),side:fd.get("side"),volume:fd.get("volume")};if(b.type=="limit")b.price=fd.get("price");try{await fetch(API+"/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});this.reset();loadOrders();loadPortfolio();alert("Order placed!")}catch(err){alert("Error: "+err.message)}};async function loadPortfolio(){try{const r=await fetch(API+"/api/portfolio");const j=await r.json();let t=0,v="<table style=width:100%>";v+="<tr><th>Exchange<th>Asset<th>Free<th>Locked<th>USDT</tr>";if(j.exchanges)for(const[ex,bal]of Object.entries(j.exchanges))for(const b of bal){const f=parseFloat(b.free||0),l=parseFloat(b.locked||0),val=parseFloat(b.usdt_value||0);t+=val;v+="<tr><td>"+ex+"<td>"+b.asset+"<td>"+f.toFixed(4)+"<td>"+l.toFixed(4)+"<td>$"+val.toFixed(2)+"</tr>"}v+="<tr><td colspan=4>Total<td>$"+t.toFixed(2);document.getElementById("portfolioContent").innerHTML=v||"<div>No balances</div>";renderPositions(j)}catch(e){console.error(e)}}function renderPositions(d){let v="";if(d.exchanges)for(const[ex,bal]of Object.entries(d.exchanges))for(const b of bal){const t=parseFloat(b.free||0)+parseFloat(b.locked||0);if(t>0&&b.asset!="USDT")v+="<div style=background:#0f1419;padding:8px;border-radius:4px;margin-bottom:8px><div>"+b.asset+"<span style=color:#71767b;font-size:12px> - "+ex+"</span></div><div style=color:#00ba7c>"+t.toFixed(4)+"</div>"}document.getElementById("positionContent").innerHTML=v||"<div style=color:#71767b;text-align:center>No positions</div>"}async function loadOrders(){try{const r=await fetch(API+"/api/orders");const j=await r.json();let v="<table style=width:100%>";v+="<tr><th>Exchange<th>Symbol<th>Side<th>Type<th>Price<th>Volume<th>Status<th></tr>";if(j&&j.length)for(const o of j){v+="<tr><td>"+o.exchange+"<td>"+o.symbol+"<td>"+o.side+"<td>"+o.order_type+"<td>"+(o.price||"--")+"<td>"+o.volume+"<td>"+o.status+"<td><button onclick=cancel(""+o.order_id+"") style=background:transparent;border:1px solid #f4212e;color:#f4212e;padding:4px 8px;border-radius:4px;cursor:pointer>Cancel</button></tr>"}document.getElementById("ordersContent").innerHTML=v||"<div>No orders</div>"}catch(e){console.error(e)}}async function cancel(id){await fetch(API+"/api/orders/"+id,{method:"DELETE"});loadOrders()}init();loadPortfolio();loadOrders();setInterval(loadPortfolio,10000);setInterval(loadOrders,10000)</script></body></html>
