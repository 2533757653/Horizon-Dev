<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Horizon</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="margin:0;font-family:system-ui;background:#0f1419;color:#e7e9ea">
<header style="background:#1a1f26;padding:12px24px;display:flex;justify-content:space-between;align-items:center">
    <h1 style="color:#fff;margin:0">Horizon Trading Platform</h1>
    <div style="display:flex;align-items:center;gap:16px">
        <span id="proposalBadge" style="background:#667eea;color:#fff;padding:4px 12px;border-radius:12px;font-size:14px;font-weight:600;display:none">0 Proposals</span>
        <span id="connectionStatus"><span id="dot" style="display:inline-block;width:8px;height:8px;background:#f4212e;border-radius:50%"></span> <span style="color:#71767b">Disconnected</span></span>
        <span id="liveIndicator" style="background:#00ba7c;color:#fff;padding:4px 10px;border-radius:4px;display:none">LIVE</span>
    </div>
</header>
<main style="padding:16px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
        <div style="background:#1a1f26;border:1px solid #2f3336;border-radius:8px;padding:16px">
            <h3 style="color:#71767b;margin-bottom:8px">Market Data</h3>
            <div id="tickers">
                <div style="padding:8px;background:#0f1419;border-radius:4px;margin-bottom:8px">
                    <div style="color:#71767b">BTC</div>
                    <div id="price-BTCUSDT" style="font-size:20px;color:#fff">--</div>
                    <div id="vol-BTCUSDT" style="color:#71767b;font-size:12px">--</div>
                </div>
                <div style="padding:8px;background:#0f1419;border-radius:4px;margin-bottom:8px">
                    <div style="color:#71767b">ETH</div>
                    <div id="price-ETHUSDT" style="font-size:20px;color:#fff">--</div>
                    <div id="vol-ETHUSDT" style="color:#71767b;font-size:12px">--</div>
                </div>
                <div style="padding:8px;background:#0f1419;border-radius:4px;margin-bottom:8px">
                    <div style="color:#71767b">SOL</div>
                    <div id="price-SOLUSDT" style="font-size:20px;color:#fff">--</div>
                    <div id="vol-SOLUSDT" style="color:#71767b;font-size:12px">--</div>
                </div>
            </div>
        </div>
        <div style="background:#1a1f26;border:1px solid #2f3336;border-radius:8px;padding:16px">
            <h3 style="color:#71767b;margin-bottom:8px">Portfolio</h3>
            <div id="portfolioContent"><div style="color:#71767b;text-align:center;padding:20px">Loading...</div></div>
        </div>
        <div style="background:#1a1f26;border:1px solid #2f3336;border-radius:8px;padding:16px">
            <h3 style="color:#71767b;margin-bottom:8px">Positions</h3>
            <div id="positionContent"><div style="color:#71767b;text-align:center;padding:20px">Loading...</div></div>
        </div>
        <div style="background:#1a1f26;border:1px solid #2f3336;border-radius:8px;padding:16px">
            <h3 style="color:#71767b;margin-bottom:8px">Place Order</h3>
            <form id="form" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                <select name="exchange" style="background:#0f1419;border:1px solid #2f3336;color:#e7e9ea;padding:8px;border-radius:4px">
                    <option>Binance</option><option>HTX</option><option>Hyperliquid</option>
                </select>
                <select name="symbol" style="background:#0f1419;border:1px solid #2f3336;color:#e7e9ea;padding:8px;border-radius:4px">
                    <option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option><option>BNBUSDT</option>
                </select>
                <select name="type" id="type" style="background:#0f1419;border:1px solid #2f3336;color:#e7e9ea;padding:8px;border-radius:4px">
                    <option value="market">Market</option><option value="limit">Limit</option>
                </select>
                <input type="number" name="volume" step="0.0001" placeholder="Volume" required style="background:#0f1419;border:1px solid #2f3336;color:#e7e9ea;padding:8px;border-radius:4px">
                <input type="number" name="price" id="price" placeholder="Price" style="background:#0f1419;border:1px solid #2f3336;color:#e7e9ea;padding:8px;border-radius:4px;display:none">
                <div style="display:grid;grid-column:1/-1;grid-template-columns:1fr 1fr;gap:8px">
                    <button type="submit" name="side" value="buy" style="background:#00ba7c;color:#fff;border:none;padding:10px;border-radius:4px;cursor:pointer;font-weight:600">BUY</button>
                    <button type="submit" name="side" value="sell" style="background:#f4212e;color:#fff;border:none;padding:10px;border-radius:4px;cursor:pointer;font-weight:600">SELL</button>
                </div>
            </form>
        </div>
    </div>

    <canvas id="chart" style="height:250px;margin-bottom:16px"></canvas>

    <!-- Proposal Queue Card -->
    <div style="background:#1a1f26;border:1px solid #2f3336;border-radius:8px;padding:16px;margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
            <h3 style="color:#e7e9ea;margin:0">LLM Proposals</h3>
            <span id="proposalCountBadge" style="background:#667eea;color:#fff;padding:4px 12px;border-radius:12px;font-size:14px;font-weight:600">0</span>
        </div>
        <div id="proposalsContent">
            <div style="color:#71767b;text-align:center;padding:20px">Loading...</div>
        </div>
    </div>

    <!-- Open Orders and LLM History Row -->
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:16px">
        <div style="background:#1a1f26;border:1px solid #2f3336;border-radius:8px;padding:16px">
            <h3 style="color:#71767b;margin-bottom:8px">Open Orders</h3>
            <div id="ordersContent"><div style="color:#71767b;text-align:center;padding:20px">Loading...</div></div>
        </div>
        <div style="background:#1a1f26;border:1px solid #2f3336;border-radius:8px;padding:16px">
            <h3 style="color:#71767b;margin-bottom:8px">LLM Analysis History</h3>
            <div id="llmHistoryContent"><div style="color:#71767b;text-align:center;padding:20px">Loading...</div></div>
        </div>
    </div>
</main>

<!-- Approve Modal -->
<div id="approveModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;justify-content:center;align-items:center">
    <div style="background:#1a1f26;border:1px solid #2f3336;border-radius:12px;padding:24px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto">
        <h3 style="color:#00ba7c;margin-top:0">Confirm Approval</h3>
        <div id="approveModalContent"></div>
        <div style="display:flex;gap:12px;margin-top:20px;justify-content:flex-end">
            <button onclick="closeApproveModal()" style="background:#2f3336;color:#e7e9ea;border:none;padding:10px 20px;border-radius:6px;cursor:pointer">Cancel</button>
            <button onclick="confirmApproval()" style="background:#00ba7c;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:600">Confirm Approval</button>
        </div>
    </div>
</div>

<!-- Reject Modal -->
<div id="rejectModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;justify-content:center;align-items:center">
    <div style="background:#1a1f26;border:1px solid #2f3336;border-radius:12px;padding:24px;max-width:500px;width:90%">
        <h3 style="color:#f4212e;margin-top:0">Confirm Rejection</h3>
        <div id="rejectModalContent"></div>
        <div style="display:flex;gap:12px;margin-top:20px;justify-content:flex-end">
            <button onclick="closeRejectModal()" style="background:#2f3336;color:#e7e9ea;border:none;padding:10px 20px;border-radius:6px;cursor:pointer">Cancel</button>
            <button onclick="confirmRejection()" style="background:#f4212e;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:600">Confirm Rejection</button>
        </div>
    </div>
</div>

<script>
const API = "";
let c;
let d = {l: [], p: []};
let pendingApprovalId = null;
let pendingRejectionId = null;

function init() {
    c = new Chart(document.getElementById("chart").getContext("2d"), {
        type: "line",
        data: {labels: d.l, datasets:[{data: d.p, borderColor: "#00ba7c", fill: true, tension: 0.4}]},
        options: {responsive: true, maintainAspectRatio: false, plugins: {legend: {display: false}}}
    });

    document.getElementById("type").onchange = function() {
        document.getElementById("price").style.display = this.value === "limit" ? "block" : "none";
    };

    document.getElementById("form").onsubmit = async function(e) {
        e.preventDefault();
        const fd = new FormData(this);
        const b = {exchange: fd.get("exchange"), symbol: fd.get("symbol"), type: fd.get("type"), side: fd.get("side"), volume: fd.get("volume")};
        if (b.type === "limit") b.price = fd.get("price");
        try {
            await fetch(API + "/api/orders", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(b)});
            this.reset();
            loadOrders();
            loadPortfolio();
            alert("Order placed!");
        } catch(err) { alert("Error: " + err.message); }
    };

    connectSSE();
    loadPortfolio();
    loadOrders();
    loadProposals();
    loadLLMHistory();

    setInterval(loadPortfolio, 10000);
    setInterval(loadOrders, 10000);
    setInterval(loadProposals, 10000);
}

function connectSSE() {
    const es = new EventSource(API + "/api/market-data/stream");
    es.onopen = () => {
        document.getElementById("dot").style.background = "#00ba7c";
        document.getElementById("liveIndicator").style.display = "inline-block";
    };
    es.onmessage = (e) => {
        const data = JSON.parse(e.data);
        const priceEl = document.getElementById("price-" + data.symbol);
        const volEl = document.getElementById("vol-" + data.symbol);
        if (priceEl) priceEl.textContent = "$" + parseFloat(data.price).toLocaleString();
        if (volEl) volEl.textContent = "Vol: " + parseFloat(data.volume_24h).toLocaleString();
        d.l.push(new Date().toLocaleTimeString());
        d.p.push(parseFloat(data.price));
        if (d.l.length > 30) { d.l.shift(); d.p.shift(); }
        c.update();
    };
    es.onerror = () => {
        document.getElementById("dot").style.background = "#f4212e";
        document.getElementById("liveIndicator").style.display = "none";
    };
}

async function loadPortfolio() {
    try {
        const r = await fetch(API + "/api/portfolio");
        const j = await r.json();
        let t = 0, v = "<table style='width:100%'>";
        v += "<tr><th>Exchange<th>Asset<th>Free<th>Locked<th>USDT</tr>";
        if (j.exchanges) for (const [ex, bal] of Object.entries(j.exchanges)) for (const b of bal) {
            const f = parseFloat(b.free || 0), l = parseFloat(b.locked || 0), val = parseFloat(b.usdt_value || 0);
            t += val;
            v += "<tr><td>" + ex + "<td>" + b.asset + "<td>" + f.toFixed(4) + "<td>" + l.toFixed(4) + "<td>$" + val.toFixed(2) + "</tr>";
        }
        v += "<tr><td colspan=4>Total<td>$" + t.toFixed(2);
        document.getElementById("portfolioContent").innerHTML = v || "<div>No balances</div>";
        renderPositions(j);
    } catch (e) { console.error(e); }
}

function renderPositions(d) {
    let v = "";
    if (d.exchanges) for (const [ex, bal] of Object.entries(d.exchanges)) for (const b of bal) {
        const t = parseFloat(b.free || 0) + parseFloat(b.locked || 0);
        if (t > 0 && b.asset !== "USDT") v += "<div style='background:#0f1419;padding:8px;border-radius:4px;margin-bottom:8px'><div>" + b.asset + "<span style='color:#71767b;font-size:12px'> - " + ex + "</span></div><div style='color:#00ba7c'>" + t.toFixed(4) + "</div>";
    }
    document.getElementById("positionContent").innerHTML = v || "<div style='color:#71767b;text-align:center'>No positions</div>";
}

async function loadOrders() {
    try {
        const r = await fetch(API + "/api/orders");
        const j = await r.json();
        let v = "<table style='width:100%;font-size:13px'>";
        v += "<tr><th>Exchange<th>Symbol<th>Side<th>Type<th>Price<th>Volume<th>Status<th></tr>";
        if (j && j.length) for (const o of j) {
            v += "<tr><td>" + o.exchange + "<td>" + o.symbol + "<td>" + o.side + "<td>" + o.order_type + "<td>" + (o.price || "--") + "<td>" + o.volume + "<td>" + o.status + "<td><button onclick=cancel('" + o.order_id + "') style='background:transparent;border:1px solid #f4212e;color:#f4212e;padding:4px 8px;border-radius:4px;cursor:pointer'>Cancel</button></tr>";
        }
        document.getElementById("ordersContent").innerHTML = v || "<div>No orders</div>";
    } catch (e) { console.error(e); }
}

async function cancel(id) {
    await fetch(API + "/api/orders/" + id, {method: "DELETE"});
    loadOrders();
}

// Proposal Queue Functions
async function loadProposals() {
    try {
        const r = await fetch(API + "/api/proposals");
        const j = await r.json();
        const proposals = j.proposals || [];
        const proposedCount = proposals.filter(p => p.status === "proposed").length;

        // Update badge
        const badge = document.getElementById("proposalCountBadge");
        badge.textContent = proposedCount;
        badge.style.display = proposedCount > 0 ? "inline-block" : "none";

        let v = "<table style='width:100%;font-size:13px'>";
        v += "<tr><th>ID</th><th>Symbol</th><th>Side</th><th>Type</th><th>Volume</th><th>Conf</th><th>Risk</th><th>Rationale</th><th>Status</th><th>Actions</th></tr>";

        if (proposals.length === 0) {
            v += "<tr><td colspan=10 style='text-align:center;color:#71767b;padding:20px'>No proposals</td></tr>";
        } else {
            for (const p of proposals) {
                const shortId = p.id.substring(0, 8);
                const rationale = (p.llm_rationale || "").substring(0, 80) + ((p.llm_rationale || "").length > 80 ? "..." : "");
                const sideColor = p.side === "buy" ? "#00ba7c" : "#f4212e";
                const confidenceColor = p.confidence_score >= 80 ? "#00ba7c" : p.confidence_score >= 60 ? "#e7e9ea" : "#f4212e";
                const riskColor = p.risk_tier === "low" ? "#00ba7c" : p.risk_tier === "medium" ? "#e7e9ea" : "#f4212e";

                v += "<tr>";
                v += "<td title='" + p.id + "'>" + shortId + "</td>";
                v += "<td>" + p.symbol + "</td>";
                v += "<td style='color:" + sideColor + ";font-weight:600'>" + p.side.toUpperCase() + "</td>";
                v += "<td>" + p.order_type + "</td>";
                v += "<td>" + p.volume + "</td>";
                v += "<td style='color:" + confidenceColor + "'>" + p.confidence_score + "</td>";
                v += "<td style='color:" + riskColor + "'>" + p.risk_tier + "</td>";
                v += "<td title='" + (p.llm_rationale || "") + "'>" + rationale + "</td>";
                v += "<td>" + p.status + "</td>";

                // Actions column
                if (p.status === "proposed") {
                    v += "<td><button onclick='showApproveModal(" + JSON.stringify(p).replace(/'/g, "&#39;") + ")' style='background:#00ba7c;color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;margin-right:4px'>Approve</button>";
                    v += "<button onclick='showRejectModal(" + JSON.stringify(p).replace(/'/g, "&#39;") + ")' style='background:#f4212e;color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer'>Reject</button></td>";
                } else if (p.status === "approved" || p.status === "executed") {
                    const orderId = p.executed_order_id || "N/A";
                    v += "<td><span style='background:#00ba7c;color:#fff;padding:6px 10px;border-radius:4px'>Executed</span> " + (p.executed_order_id ? "<a href='#' onclick='loadOrders()' style='color:#667eea'>" + orderId.substring(0, 8) + "</a>" : "") + "</td>";
                } else if (p.status === "rejected") {
                    v += "<td><span style='background:#f4212e;color:#fff;padding:6px 10px;border-radius:4px'>Rejected</span></td>";
                } else if (p.status === "expired") {
                    v += "<td><span style='background:#71767b;color:#fff;padding:6px 10px;border-radius:4px'>Expired</span></td>";
                } else {
                    v += "<td>" + p.status + "</td>";
                }
                v += "</tr>";
            }
        }
        v += "</table>";
        document.getElementById("proposalsContent").innerHTML = v;
    } catch (e) { console.error(e); }
}

async function approveProposal(id) {
    try {
        const r = await fetch(API + "/api/proposals/" + id + "/approve", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({approved_by: "dashboard_user"})
        });
        if (!r.ok) {
            const err = await r.json();
            alert("Error: " + (err.detail || r.statusText));
        } else {
            closeApproveModal();
            loadProposals();
            loadOrders();
        }
    } catch (e) { alert("Error: " + e.message); }
}

async function rejectProposal(id, reason) {
    try {
        const r = await fetch(API + "/api/proposals/" + id + "/reject", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({rejected_by: "dashboard_user", reason: reason})
        });
        if (!r.ok) {
            const err = await r.json();
            alert("Error: " + (err.detail || r.statusText));
        } else {
            closeRejectModal();
            loadProposals();
        }
    } catch (e) { alert("Error: " + e.message); }
}

function showApproveModal(proposal) {
    pendingApprovalId = proposal.id;

    let priceInfo = "";
    if (proposal.order_type === "limit" && proposal.price) {
        priceInfo = "<div class='stat'><span class='stat-label'>Proposed Price</span><span class='stat-value'>$" + parseFloat(proposal.price).toLocaleString() + "</span></div>";
    }

    let techContext = "";
    try {
        const tech = JSON.parse(proposal.technical_context || "{}");
        if (tech && Object.keys(tech).length > 0) {
            techContext = "<div style='margin-top:12px;padding:12px;background:#0f1419;border-radius:8px'><h4 style='color:#667eea;margin:0 0 8px 0'>Technical Context</h4>";
            for (const [key, value] of Object.entries(tech)) {
                techContext += "<div class='stat'><span class='stat-label'>" + key + "</span><span class='stat-value'>" + value + "</span></div>";
            }
            techContext += "</div>";
        }
    } catch (e) {}

    let marketSnapshot = "";
    try {
        const market = JSON.parse(proposal.market_snapshot || "{}");
        if (market && market.current_price) {
            marketSnapshot = "<div class='stat'><span class='stat-label'>Current Market Price</span><span class='stat-value'>$" + parseFloat(market.current_price).toLocaleString() + "</span></div>";
        }
    } catch (e) {}

    const content = "<div style='max-height:400px;overflow-y:auto'>" +
        "<div style='padding:12px;background:#0f1419;border-radius:8px;margin-bottom:12px'>" +
        "<div class='stat'><span class='stat-label'>Symbol</span><span class='stat-value' style='color:#667eea'>" + proposal.symbol + "</span></div>" +
        "<div class='stat'><span class='stat-label'>Side</span><span class='stat-value' style='color:" + (proposal.side === "buy" ? "#00ba7c" : "#f4212e") + "'>" + proposal.side.toUpperCase() + "</span></div>" +
        "<div class='stat'><span class='stat-label'>Type</span><span class='stat-value'>" + proposal.order_type + "</span></div>" +
        "<div class='stat'><span class='stat-label'>Volume</span><span class='stat-value'>" + proposal.volume + "</span></div>" +
        priceInfo +
        marketSnapshot +
        "</div>" +
        "<div style='margin-bottom:12px'>" +
        "<h4 style='color:#667eea;margin:0 0 8px 0'>LLM Rationale</h4>" +
        "<div style='background:#0f1419;padding:12px;border-radius:8px;color:#e7e9ea;white-space:pre-wrap'>" + (proposal.llm_rationale || "No rationale provided") + "</div>" +
        "</div>" +
        techContext +
        "</div>";

    document.getElementById("approveModalContent").innerHTML = content;
    document.getElementById("approveModal").style.display = "flex";
}

function showRejectModal(proposal) {
    pendingRejectionId = proposal.id;

    const content = "<div style='margin-bottom:12px'>" +
        "<p style='color:#71767b'>You are about to reject this proposal:</p>" +
        "<div style='background:#0f1419;padding:12px;border-radius:8px'>" +
        "<div><strong>" + proposal.side.toUpperCase() + "</strong> " + proposal.volume + " " + proposal.symbol + "</div>" +
        "<div style='color:#71767b;margin-top:4px'>Confidence: " + proposal.confidence_score + " | Risk: " + proposal.risk_tier + "</div>" +
        "</div>" +
        "</div>" +
        "<div style='margin-top:16px'>" +
        "<label style='color:#71767b;display:block;margin-bottom:8px'>Rejection Reason (optional)</label>" +
        "<textarea id='rejectReason' rows=3 style='width:100%;background:#0f1419;border:1px solid #2f3336;color:#e7e9ea;padding:12px;border-radius:8px;resize:none' placeholder='Enter reason...'></textarea>" +
        "</div>";

    document.getElementById("rejectModalContent").innerHTML = content;
    document.getElementById("rejectModal").style.display = "flex";
}

function confirmApproval() {
    if (pendingApprovalId) {
        approveProposal(pendingApprovalId);
        pendingApprovalId = null;
    }
}

function confirmRejection() {
    if (pendingRejectionId) {
        const reason = document.getElementById("rejectReason").value;
        rejectProposal(pendingRejectionId, reason);
        pendingRejectionId = null;
    }
}

function closeApproveModal() {
    document.getElementById("approveModal").style.display = "none";
    pendingApprovalId = null;
}

function closeRejectModal() {
    document.getElementById("rejectModal").style.display = "none";
    pendingRejectionId = null;
}

// LLM History Functions
async function loadLLMHistory() {
    try {
        const r = await fetch(API + "/api/llm/history?limit=5");
        const j = await r.json();
        const history = j.history || [];

        if (history.length === 0) {
            document.getElementById("llmHistoryContent").innerHTML = "<div style='color:#71767b;text-align:center;padding:20px'>No analysis runs yet</div>";
            return;
        }

        let v = "<div style='max-height:300px;overflow-y:auto'>";
        for (const h of history) {
            const statusColor = h.completion_status === "success" ? "#00ba7c" : h.completion_status === "error" ? "#f4212e" : "#e7e9ea";
            const time = h.triggered_at ? new Date(h.triggered_at).toLocaleString() : "Unknown";
            v += "<div style='background:#0f1419;padding:10px;border-radius:6px;margin-bottom:8px'>";
            v += "<div style='display:flex;justify-content:space-between;margin-bottom:4px'>";
            v += "<span style='color:#71767b;font-size:11px'>" + time + "</span>";
            v += "<span style='color:" + statusColor + ";font-size:11px;font-weight:600'>" + h.completion_status.toUpperCase() + "</span>";
            v += "</div>";
            v += "<div style='display:flex;justify-content:space-between;color:#e7e9ea;font-size:12px'>";
            v += "<span>Proposals: " + (h.parsed_proposals_count || 0) + "</span>";
            v += "<span>" + (h.latency_ms ? (h.latency_ms + "ms") : "--") + "</span>";
            v += "</div>";
            if (h.error_message) {
                v += "<div style='color:#f4212e;font-size:11px;margin-top:4px'>" + h.error_message.substring(0, 50) + "</div>";
            }
            v += "</div>";
        }
        v += "</div>";
        document.getElementById("llmHistoryContent").innerHTML = v;
    } catch (e) { console.error(e); }
}

init();
</script>
</body>
</html>
