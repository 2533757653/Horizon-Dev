<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Trading Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }

        /* Header Bar */
        .header {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            color: #f0f6fc;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f85149;
            transition: background-color 0.3s ease;
        }

        .status-dot.connected {
            background-color: #3fb950;
        }

        .status-label {
            font-size: 13px;
            color: #8b949e;
        }

        .mode-badge {
            background-color: #238636;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Main Content */
        .main-content {
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
        }

        .card.full-width {
            grid-column: 1 / -1;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Portfolio Table */
        .portfolio-table {
            width: 100%;
            border-collapse: collapse;
        }

        .portfolio-table th,
        .portfolio-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #30363d;
        }

        .portfolio-table th {
            color: #8b949e;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
        }

        .portfolio-table td {
            font-size: 14px;
        }

        .portfolio-table tr:last-child td {
            border-bottom: none;
        }

        .total-value {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label {
            font-size: 14px;
            color: #8b949e;
        }

        .total-amount {
            font-size: 24px;
            font-weight: 600;
            color: #f0f6fc;
        }

        /* Market Data Cards */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .ticker-card {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
        }

        .ticker-symbol {
            font-size: 16px;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 8px;
        }

        .ticker-price {
            font-size: 20px;
            font-weight: 600;
            color: #58a6ff;
            margin-bottom: 4px;
        }

        .ticker-volume {
            font-size: 13px;
            color: #8b949e;
        }

        /* Order Form */
        .order-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 12px;
            color: #8b949e;
            text-transform: uppercase;
        }

        .form-select,
        .form-input {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px 12px;
            color: #c9d1d9;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-select:focus,
        .form-input:focus {
            border-color: #58a6ff;
        }

        .submit-btn {
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            grid-column: 1 / -1;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background-color: #2ea043;
        }

        /* Orders Table */
        .orders-table {
            width: 100%;
            border-collapse: collapse;
        }

        .orders-table th,
        .orders-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #30363d;
        }

        .orders-table th {
            color: #8b949e;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
        }

        .orders-table td {
            font-size: 13px;
        }

        .orders-table tr:last-child td {
            border-bottom: none;
        }

        .side-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .side-badge.buy {
            background-color: rgba(46, 160, 67, 0.2);
            color: #3fb950;
        }

        .side-badge.sell {
            background-color: rgba(248, 81, 73, 0.2);
            color: #f85149;
        }

        .cancel-btn {
            background-color: transparent;
            border: 1px solid #f85149;
            color: #f85149;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cancel-btn:hover {
            background-color: #f85149;
            color: #ffffff;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 20px;
            color: #8b949e;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .order-form {
                grid-template-columns: 1fr;
            }
        }

        /* Alert Toast */
        .alert-toast {
            position: fixed;
            top: 80px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .alert-toast.success {
            background-color: #238636;
            color: #ffffff;
        }

        .alert-toast.error {
            background-color: #da3633;
            color: #ffffff;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="header-title">Horizon Trading Platform</h1>
        <div class="header-status">
            <div class="status-indicator">
                <div class="status-dot" id="connectionDot"></div>
                <span class="status-label" id="connectionLabel">Disconnected</span>
            </div>
            <div class="mode-badge" id="modeBadge">LIVE</div>
        </div>
    </header>

    <main class="main-content">
        <!-- Portfolio Card -->
        <div class="card">
            <h2 class="card-title">Portfolio</h2>
            <div id="portfolioContent">
                <div class="loading">Loading portfolio...</div>
            </div>
        </div>

        <!-- Market Data Card -->
        <div class="card">
            <h2 class="card-title">Market Data</h2>
            <div class="market-grid">
                <div class="ticker-card" id="ticker-BTCUSDT">
                    <div class="ticker-symbol">BTCUSDT</div>
                    <div class="ticker-price">--</div>
                    <div class="ticker-volume">--</div>
                </div>
                <div class="ticker-card" id="ticker-ETHUSDT">
                    <div class="ticker-symbol">ETHUSDT</div>
                    <div class="ticker-price">--</div>
                    <div class="ticker-volume">--</div>
                </div>
                <div class="ticker-card" id="ticker-SOLUSDT">
                    <div class="ticker-symbol">SOLUSDT</div>
                    <div class="ticker-price">--</div>
                    <div class="ticker-volume">--</div>
                </div>
                <div class="ticker-card" id="ticker-BNBUSDT">
                    <div class="ticker-symbol">BNBUSDT</div>
                    <div class="ticker-price">--</div>
                    <div class="ticker-volume">--</div>
                </div>
            </div>
        </div>

        <!-- Order Ticket Card -->
        <div class="card">
            <h2 class="card-title">Order Ticket</h2>
            <form class="order-form" id="orderForm">
                <div class="form-group">
                    <label class="form-label">Exchange</label>
                    <select class="form-select" name="exchange" required>
                        <option value="binance">Binance</option>
                        <option value="htx">HTX</option>
                        <option value="hyperliquid">Hyperliquid</option>
                        <option value="bitget">Bitget</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Symbol</label>
                    <select class="form-select" name="symbol" required>
                        <option value="BTCUSDT">BTCUSDT</option>
                        <option value="ETHUSDT">ETHUSDT</option>
                        <option value="SOLUSDT">SOLUSDT</option>
                        <option value="BNBUSDT">BNBUSDT</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Side</label>
                    <select class="form-select" name="side" required>
                        <option value="buy">Buy</option>
                        <option value="sell">Sell</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Type</label>
                    <select class="form-select" name="type" required>
                        <option value="market">Market</option>
                        <option value="limit">Limit</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Price (USDT)</label>
                    <input class="form-input" type="number" name="price" step="0.01" placeholder="Required for limit orders">
                </div>
                <div class="form-group">
                    <label class="form-label">Volume</label>
                    <input class="form-input" type="number" name="volume" step="0.0001" required placeholder="0.0001">
                </div>
                <button type="submit" class="submit-btn">Submit Order</button>
            </form>
        </div>

        <!-- Open Orders Card -->
        <div class="card">
            <h2 class="card-title">Open Orders</h2>
            <div id="ordersContent">
                <div class="loading">Loading orders...</div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = '';

        // SSE Connection Management
        let eventSource = null;
        let reconnectTimeout = null;

        function connectSSE() {
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource(`${API_BASE}/api/market-data/stream`);

            eventSource.onopen = () => {
                updateConnectionStatus(true);
            };

            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    updateTicker(data);
                } catch (e) {
                    console.error('Failed to parse SSE message:', e);
                }
            };

            eventSource.onerror = () => {
                updateConnectionStatus(false);
                eventSource.close();
                eventSource = null;

                // Reconnect after 3 seconds
                reconnectTimeout = setTimeout(() => {
                    connectSSE();
                }, 3000);
            };
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('connectionDot');
            const label = document.getElementById('connectionLabel');

            if (connected) {
                dot.classList.add('connected');
                label.textContent = 'Connected';
            } else {
                dot.classList.remove('connected');
                label.textContent = 'Disconnected';
            }
        }

        function updateTicker(data) {
            const symbols = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'BNBUSDT'];
            const symbol = data.symbol;

            if (!symbols.includes(symbol)) return;

            const tickerCard = document.getElementById(`ticker-${symbol}`);
            if (tickerCard) {
                const price = parseFloat(data.last_price).toFixed(2);
                const volume = formatVolume(data.volume_24h);

                tickerCard.querySelector('.ticker-price').textContent = `$${price}`;
                tickerCard.querySelector('.ticker-volume').textContent = `$${volume}`;
            }
        }

        function formatVolume(volume) {
            if (!volume) return '--';
            const vol = parseFloat(volume);
            if (vol >= 1000000000) {
                return (vol / 1000000000).toFixed(2) + 'B';
            } else if (vol >= 1000000) {
                return (vol / 1000000).toFixed(2) + 'M';
            } else if (vol >= 1000) {
                return (vol / 1000).toFixed(2) + 'K';
            }
            return vol.toFixed(2);
        }

        // Portfolio
        async function fetchPortfolio() {
            try {
                const response = await fetch(`${API_BASE}/api/portfolio`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                renderPortfolio(data);
            } catch (e) {
                console.error('Failed to fetch portfolio:', e);
            }
        }

        function renderPortfolio(data) {
            const container = document.getElementById('portfolioContent');

            if (!data || !data.balances || data.balances.length === 0) {
                container.innerHTML = '<div class="loading">No portfolio data available</div>';
                return;
            }

            let html = `
                <table class="portfolio-table">
                    <thead>
                        <tr>
                            <th>Exchange</th>
                            <th>Asset</th>
                            <th>Free</th>
                            <th>Locked</th>
                            <th>USDT Value</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            let totalValue = 0;

            data.balances.forEach(balance => {
                const free = parseFloat(balance.free || 0).toFixed(4);
                const locked = parseFloat(balance.locked || 0).toFixed(4);
                const value = parseFloat(balance.usdt_value || 0).toFixed(2);
                totalValue += parseFloat(balance.usdt_value || 0);

                html += `
                    <tr>
                        <td>${escapeHtml(balance.exchange)}</td>
                        <td>${escapeHtml(balance.asset)}</td>
                        <td>${free}</td>
                        <td>${locked}</td>
                        <td>$${value}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
                <div class="total-value">
                    <span class="total-label">Total USDT Value</span>
                    <span class="total-amount">$${totalValue.toFixed(2)}</span>
                </div>
            `;

            container.innerHTML = html;
        }

        // Orders
        async function fetchOrders() {
            try {
                const response = await fetch(`${API_BASE}/api/orders?status=open`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                renderOrders(data);
            } catch (e) {
                console.error('Failed to fetch orders:', e);
            }
        }

        function renderOrders(data) {
            const container = document.getElementById('ordersContent');

            if (!data || !data.orders || data.orders.length === 0) {
                container.innerHTML = '<div class="loading">No open orders</div>';
                return;
            }

            let html = `
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Exchange</th>
                            <th>Symbol</th>
                            <th>Side</th>
                            <th>Type</th>
                            <th>Price</th>
                            <th>Volume</th>
                            <th>Filled</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.orders.forEach(order => {
                const sideClass = order.side === 'buy' ? 'buy' : 'sell';
                const price = order.price ? parseFloat(order.price).toFixed(2) : '--';
                const volume = parseFloat(order.volume || 0).toFixed(4);
                const filled = parseFloat(order.filled || 0).toFixed(4);

                html += `
                    <tr>
                        <td>${escapeHtml(order.exchange)}</td>
                        <td>${escapeHtml(order.symbol)}</td>
                        <td><span class="side-badge ${sideClass}">${escapeHtml(order.side).toUpperCase()}</span></td>
                        <td>${escapeHtml(order.type)}</td>
                        <td>$${price}</td>
                        <td>${volume}</td>
                        <td>${filled}</td>
                        <td>${escapeHtml(order.status)}</td>
                        <td><button class="cancel-btn" onclick="cancelOrder('${order.id}')">Cancel</button></td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        async function cancelOrder(orderId) {
            try {
                const response = await fetch(`${API_BASE}/api/orders/${orderId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                showAlert('Order cancelled successfully', 'success');
                fetchOrders();
            } catch (e) {
                console.error('Failed to cancel order:', e);
                showAlert('Failed to cancel order: ' + e.message, 'error');
            }
        }

        // Order Form
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const orderData = {
                exchange: formData.get('exchange'),
                symbol: formData.get('symbol'),
                side: formData.get('side'),
                type: formData.get('type'),
                volume: formData.get('volume')
            };

            const price = formData.get('price');
            if (orderData.type === 'limit') {
                if (!price) {
                    showAlert('Price is required for limit orders', 'error');
                    return;
                }
                orderData.price = price;
            }

            try {
                const response = await fetch(`${API_BASE}/api/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderData)
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const result = await response.json();
                showAlert('Order submitted successfully', 'success');
                e.target.reset();
                fetchOrders();
            } catch (e) {
                console.error('Failed to submit order:', e);
                showAlert('Failed to submit order: ' + e.message, 'error');
            }
        });

        // Utilities
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showAlert(message, type) {
            const existingAlert = document.querySelector('.alert-toast');
            if (existingAlert) {
                existingAlert.remove();
            }

            const alert = document.createElement('div');
            alert.className = `alert-toast ${type}`;
            alert.textContent = message;
            document.body.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 4000);
        }

        // Initialize
        function init() {
            connectSSE();
            fetchPortfolio();
            fetchOrders();

            // Auto-refresh every 10 seconds
            setInterval(fetchPortfolio, 10000);
            setInterval(fetchOrders, 10000);
        }

        init();
    </script>
</body>
</html>
