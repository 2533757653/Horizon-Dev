# Horizon Trading Platform Configuration

app:
  host: "0.0.0.0"
  port: 8080
  log_level: "info"

exchanges:
  binance:
    enabled: true
    recv_window_ms: 5000
    api_key: ""
    api_secret: ""
  htx:
    enabled: true
    recv_window_ms: 5000
    api_key: ""
    api_secret: ""
  hyperliquid:
    enabled: true
    recv_window_ms: 5000
    api_key: ""
    api_secret: ""
    wallet_address: ""
    private_key: ""
  bitget:
    enabled: true
    recv_window_ms: 5000
    api_key: ""
    api_secret: ""
    passphrase: ""

trading:
  market_data_poll_interval_seconds: 10
  portfolio_snapshot_interval_seconds: 60
  order_sync_interval_seconds: 30

database:
  path: "./data/horizon.db"

llm:
  enabled: false
  api_key: ""
  model: "claude-3-5-sonnet-20241022"
  analysis_interval_hours: 8

market_data:
  symbols:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "BNBUSDT"