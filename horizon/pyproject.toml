[project]
name = "horizon"
version = "0.1.0"
description = "Horizon Trading Platform - Quantitative Trading System"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Horizon Trading Team", email = "team@horizon-trading.dev" }
]
keywords = ["trading", "quantitative", "crypto", "binance", "hyperliquid"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "aiohttp>=3.11.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.11.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
]

[project.scripts]
horizon-server = "horizon.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["horizon*"]
exclude = ["horizon/tests/*", "horizon/data/*", "horizon/.git/*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"